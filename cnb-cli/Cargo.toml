[package]
name = "cnb-cli"
version = "0.1.0"
edition = "2021"
description = "Native command-line client for CNB repositories and pull requests"
license = "Apache-2.0"

[[bin]]
name = "cnb"
path = "src/main.rs"

[dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
